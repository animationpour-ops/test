name: Build du mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compiler
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Publier le jar
        uses: actions/upload-artifact@v4
        with:
          name: endportalskin-jar
          path: build/libs/*.jar
